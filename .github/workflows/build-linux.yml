name: Build Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # No ffmpeg here: the app bundles a static one as the scribble-ffmpeg
        # sidecar (scripts/fetch-build-deps.sh).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The backend is a Rust axum server inside the Tauri process — no Python
      # sidecar. This stages the streaming STT model (HuggingFace, sha256
      # pinned) and the static ffmpeg sidecar (binaries/scribble-ffmpeg-*).
      - name: Fetch models + ffmpeg
        run: bash scripts/fetch-build-deps.sh x86_64-unknown-linux-gnu

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri
        # Signing env vars trigger `.sig` generation for the AppImage. Updater
        # uses AppImage on Linux (deb has no manifest entry). If secret unset,
        # build still works but produces no signature → auto-update offline.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        # First of the 3 parallel platform builds wins the race + creates the
        # draft; the rest no-op. See build.yml for the rationale.
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" \
              --notes "Auto-created by CI. Update notes before publishing." || \
            true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          APPIMAGE=$(find src-tauri/target -name "*.AppImage" | head -1)
          if [ -n "$APPIMAGE" ]; then
            FILENAME="Scribble_${VERSION}_amd64.AppImage"
            cp "$APPIMAGE" "$FILENAME"
            gh release upload "$TAG" "$FILENAME" --clobber
            echo "✅ Uploaded: $FILENAME"
            # Tauri emits AppImage.sig next to AppImage when signing key is set.
            # If absent (secret not configured), skip — manifest job will
            # detect missing signature and omit Linux from the manifest.
            APPIMAGE_SIG="${APPIMAGE}.sig"
            if [ -f "$APPIMAGE_SIG" ]; then
              cp "$APPIMAGE_SIG" "${FILENAME}.sig"
              gh release upload "$TAG" "${FILENAME}.sig" --clobber
              echo "✅ Uploaded: ${FILENAME}.sig"
            else
              echo "⚠️  No signature for AppImage — Linux auto-update disabled"
            fi
          fi

          DEB=$(find src-tauri/target -name "*.deb" | head -1)
          if [ -n "$DEB" ]; then
            FILENAME="scribble_${VERSION}_amd64.deb"
            cp "$DEB" "$FILENAME"
            gh release upload "$TAG" "$FILENAME" --clobber
            echo "✅ Uploaded: $FILENAME"
          fi

          if [ -z "$APPIMAGE" ] && [ -z "$DEB" ]; then
            echo "❌ No Linux bundle found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
