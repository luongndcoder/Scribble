name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Syncing version to $VERSION from tag $GITHUB_REF_NAME"
            node -e "
              const fs = require('fs');
              const v = '$VERSION';
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = v;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

              const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
              tauri.version = v;
              fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');

              let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
              cargo = cargo.replace(/^version = \".*\"/m, 'version = \"' + v + '\"');
              fs.writeFileSync('src-tauri/Cargo.toml', cargo);
            "
            echo "Successfully synced version to $VERSION"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # The backend is a Rust axum server inside the Tauri process — no Python
      # sidecar. This stages the streaming STT model (HuggingFace, sha256
      # pinned) and the static ffmpeg sidecar (binaries/scribble-ffmpeg-*.exe).
      - name: Fetch models + ffmpeg
        shell: bash
        run: bash scripts/fetch-build-deps.sh x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri NSIS installer
        shell: bash
        # TAURI_SIGNING_PRIVATE_KEY (set in GH Secrets) makes `tauri build` emit
        # a `.sig` file next to the NSIS installer — required by the updater on
        # the client side. If the secret isn't set yet, the build still
        # succeeds but produces no signature (auto-update won't verify).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build -b nsis --target x86_64-pc-windows-msvc

      - name: Resolve version + installer
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          INSTALLER=$(find src-tauri/target -name "*.exe" -path "*/nsis/*" | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "❌ No NSIS installer found"
            exit 1
          fi
          FILENAME="Scribble_${VERSION}_x64-setup.exe"
          cp "$INSTALLER" "$FILENAME"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "✅ Built: $FILENAME"
          # Tauri auto-signs the installer when TAURI_SIGNING_PRIVATE_KEY is set
          # — emits a `.sig` next to the .exe. We copy it alongside the renamed
          # installer so the manifest job downstream can find it.
          SIG_SRC="${INSTALLER}.sig"
          if [ -f "$SIG_SRC" ]; then
            cp "$SIG_SRC" "${FILENAME}.sig"
            echo "sig_filename=${FILENAME}.sig" >> "$GITHUB_OUTPUT"
            echo "✅ Signature: ${FILENAME}.sig"
          else
            echo "⚠️  No signature found at $SIG_SRC — auto-update will fail until TAURI_SIGNING_PRIVATE_KEY is set in repo secrets"
          fi

      - name: Ensure release exists
        # `gh release upload` requires the release to already exist. We don't
        # gate the workflow on a manual pre-step — instead, the first of the
        # 3 parallel platform builds wins the race and creates the draft;
        # the rest fall through to a no-op `gh release view`. Race-safe
        # because gh returns non-zero on duplicate create, which we swallow.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" \
              --notes "Auto-created by CI. Update notes before publishing." || \
            true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release upload "$TAG" "${{ steps.version.outputs.filename }}" --clobber
          # Signature is optional — skip silently if missing (e.g. secret not
          # configured yet). The manifest job will detect and skip Windows.
          if [ -f "${{ steps.version.outputs.filename }}.sig" ]; then
            gh release upload "$TAG" "${{ steps.version.outputs.filename }}.sig" --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: scribble-windows-installer
          path: |
            ${{ steps.version.outputs.filename }}
            ${{ steps.version.outputs.filename }}.sig
          retention-days: 30
          if-no-files-found: warn
